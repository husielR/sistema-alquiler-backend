name: Compilacion Backend
on:
  push:
    branches: [ "main" ]

jobs:
  compilar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el codigo fuente
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Ejecutar compilacion Maven
        run: mvn clean compile