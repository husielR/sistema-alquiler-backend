name: Compilacion Backend
on:
  push:
    branches: [ "main" ]

jobs:
  compilar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el codigo fuente
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Construir y Escanear en SonarCloud
        env:
            SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: mvn clean verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar -Dsonar.projectKey=sistema-alquiler-backend -Dsonar.organization=husielr -Dsonar.host.url=https://sonarcloud.io